<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AOAO Studio — 로그인 중</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='sans-serif' font-weight='800' font-size='18' fill='white'%3EA%3C/text%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#060b18;--navy:#0a1628;
  --blue:#2563eb;--cyan:#38bdf8;
  --green:#22c55e;--red:#ef4444;
  --text:#f0f6ff;--muted:#64748b;
  --card-bg:rgba(14,22,45,.8);
  --border:rgba(255,255,255,.06);
}
html,body{height:100%;overflow:hidden;}
body{
  background:var(--bg);
  font-family:'Plus Jakarta Sans',sans-serif;
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  position:relative;
}

/* 배경 */
.bg-mesh{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 90% 70% at 15% 5%,  rgba(37,99,235,.2) 0%,transparent 50%),
    radial-gradient(ellipse 70% 60% at 85% 95%, rgba(56,189,248,.12) 0%,transparent 50%),
    radial-gradient(ellipse 50% 50% at 50% 50%, rgba(37,99,235,.05) 0%,transparent 60%);
}
canvas#bg{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.4;}

/* 카드 */
.card{
  position:relative;z-index:10;
  width:calc(100% - 40px);max-width:360px;
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:28px;
  padding:48px 36px 40px;
  backdrop-filter:blur(24px);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.04) inset,
    0 40px 100px rgba(0,0,0,.6),
    0 0 60px rgba(37,99,235,.08);
  animation:cardIn .65s cubic-bezier(.16,1,.3,1) both;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(28px)scale(.96);}
  to{opacity:1;transform:translateY(0)scale(1);}
}

/* 로고 */
.logo{text-align:center;margin-bottom:40px;animation:up .5s .1s ease both;}
@keyframes up{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.logo-mark{
  display:inline-flex;align-items:center;justify-content:center;
  width:56px;height:56px;border-radius:18px;
  background:linear-gradient(140deg,#1d4ed8,#2563eb 40%,#38bdf8);
  font-size:24px;font-weight:900;color:#fff;
  margin-bottom:14px;
  box-shadow:0 8px 28px rgba(37,99,235,.5),0 0 0 1px rgba(255,255,255,.12) inset;
  position:relative;overflow:hidden;
}
.logo-mark::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.15),transparent 50%);
}
.logo-name{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;}

/* 상태 영역 */
.status{text-align:center;animation:up .5s .18s ease both;}

/* 링 */
.ring-wrap{
  position:relative;width:80px;height:80px;margin:0 auto 26px;
}
.ring{position:absolute;inset:0;border-radius:50%;}
.ring-bg{border:1.5px solid rgba(255,255,255,.05);}
.ring-outer{
  border:1.5px solid transparent;
  border-top-color:rgba(37,99,235,.2);
  border-right-color:rgba(56,189,248,.2);
  animation:spin 3s linear infinite;
  inset:-8px;
}
.ring-main{
  border:2px solid transparent;
  border-top-color:var(--blue);
  border-right-color:var(--cyan);
  animation:spin .75s cubic-bezier(.4,0,.6,1) infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

.ring-center{
  position:absolute;inset:12px;border-radius:50%;
  background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.15);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;
}
.ring-done{
  position:absolute;inset:0;border-radius:50%;
  display:none;align-items:center;justify-content:center;
  font-size:28px;
  animation:pop .45s cubic-bezier(.16,1,.3,1) both;
}
.ring-done.ok{background:rgba(34,197,94,.1);border:1.5px solid rgba(34,197,94,.25);}
.ring-done.fail{background:rgba(239,68,68,.1);border:1.5px solid rgba(239,68,68,.25);}
@keyframes pop{from{transform:scale(.5);opacity:0;}to{transform:scale(1);opacity:1;}}

.s-title{font-size:19px;font-weight:800;margin-bottom:7px;letter-spacing:-.02em;}
.s-sub{font-size:13px;color:var(--muted);line-height:1.6;}

/* 배지 */
.badge{
  display:none;align-items:center;gap:7px;
  background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.15);
  border-radius:20px;padding:6px 14px;
  font-size:12px;font-weight:600;color:#93c5fd;
  margin:18px auto 0;width:fit-content;
}
.badge-dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:blink 1.2s ease infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}

/* 프로그레스 */
.prog{margin-top:32px;animation:up .5s .28s ease both;}
.prog-bar{height:2px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden;margin-bottom:9px;}
.prog-fill{height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .2s ease;}
.prog-meta{display:flex;justify-content:space-between;font-size:10px;font-weight:600;color:rgba(255,255,255,.18);letter-spacing:.04em;text-transform:uppercase;}

/* 에러 */
.err{
  display:none;margin-top:18px;padding:12px 14px;
  background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.2);
  border-radius:12px;font-size:12px;color:#fca5a5;line-height:1.6;
}
</style>
</head>
<body>
<div class="bg-mesh"></div>

<div class="card">
  <div class="logo">
    <div class="logo-mark">A</div>
    <div class="logo-name">AOAO Studio</div>
  </div>

  <div class="status">
    <div class="ring-wrap">
      <div class="ring ring-bg"></div>
      <div class="ring ring-outer" id="rOuter"></div>
      <div class="ring ring-main" id="rMain"></div>
      <div class="ring-center" id="rIcon">🔐</div>
      <div class="ring-done ok"  id="rOk">✓</div>
      <div class="ring-done fail" id="rFail">✕</div>
    </div>
    <div class="s-title" id="sTitle">로그인 처리 중</div>
    <div class="s-sub"   id="sSub">잠시만 기다려주세요</div>
    <div class="badge"   id="badge"><div class="badge-dot"></div><span id="badgeTxt"></span></div>
  </div>

  <div class="prog">
    <div class="prog-bar"><div class="prog-fill" id="pFill"></div></div>
    <div class="prog-meta"><span id="pLabel">세션 초기화</span><span id="pPct">0%</span></div>
  </div>
  <div class="err" id="errBox"></div>
</div>

<script>
var NAMES={zeta:'AI Girlfriend',typo:'Type Studio',game:'Game Studio',modelhub:'Model Hub'};
var ICONS={zeta:'💕',typo:'✍️',game:'🎮',modelhub:'🗄️'};

function prog(pct,lbl){
  document.getElementById('pFill').style.width=pct+'%';
  document.getElementById('pPct').textContent=pct+'%';
  if(lbl) document.getElementById('pLabel').textContent=lbl;
}
function hideSpinner(){
  document.getElementById('rOuter').style.display='none';
  document.getElementById('rMain').style.display='none';
  document.getElementById('rIcon').style.display='none';
}
function done(title,sub,dest){
  hideSpinner();
  document.getElementById('rOk').style.display='flex';
  document.getElementById('sTitle').textContent=title;
  document.getElementById('sSub').textContent=sub;
  document.getElementById('badge').style.display='none';
  prog(100,'완료');
  setTimeout(function(){location.href=dest||'/';},900);
}
function fail(msg,dest){
  hideSpinner();
  document.getElementById('rFail').style.display='flex';
  document.getElementById('sTitle').textContent='오류 발생';
  document.getElementById('sSub').textContent='';
  document.getElementById('badge').style.display='none';
  var eb=document.getElementById('errBox');
  eb.style.display='block'; eb.textContent=msg;
  document.getElementById('pFill').style.background='#ef4444';
  prog(100,'');
  setTimeout(function(){location.href=dest||'/';},2800);
}

(function(){
  var p=new URLSearchParams(location.search);
  // type 또는 site 파라미터 둘 다 지원
  var type    =p.get('type')||p.get('site')||'game'; // aoao-gmae-studio.onrender.com
  var token   =p.get('token')||'';
  var refresh =p.get('refresh')||'';
  var user    =p.get('user')||'';
  var uid     =p.get('uid')||'';
  var adm     =p.get('adm')||'false';
  var pro     =p.get('pro')||'false';
  // 사이트별 기본 URL (redirect 파라미터 없을 때 사용)
  var SITE_URLS={
    zeta:'https://aoao-studio-zeta.onrender.com/',
    typo:'https://aoao-studio-typo.onrender.com/',
    game:'https://aoao-gmae-studio.onrender.com/',
    modelhub:'https://aoao-studio-data.onrender.com/'
  };
  var redirect=p.get('redirect')||'https://aoao-gmae-studio.onrender.com/';

  var name=NAMES[type]||type||'서비스';
  var icon=ICONS[type]||'🌐';

  document.getElementById('rIcon').textContent=icon;
  document.getElementById('badgeTxt').textContent=name+' 연결 중...';
  document.getElementById('badge').style.display='flex';

  prog(15,'인증 토큰 확인 중');

  setTimeout(function(){
    prog(45,'세션 데이터 파싱');

    setTimeout(function(){
      try{
        prog(70,'localStorage 설정 중');

        if(type==='zeta'){
          if(!token) return fail('토큰 없음',redirect);
          localStorage.setItem('z-token',token);
          if(user) localStorage.setItem('z-user',decodeURIComponent(user));
          if(refresh) localStorage.setItem('z-refresh',refresh);

        } else if(type==='typo'){
          if(!token) return fail('토큰 없음',redirect);
          localStorage.setItem('sb_token',token);
          if(user) localStorage.setItem('sb_user',decodeURIComponent(user));

        } else if(type==='game'){
          if(!token) return fail('토큰 없음',redirect);
          // persistSession:false라 localStorage/sessionStorage 모두 소용없음
          // redirect URL에 token을 파라미터로 붙여서 전달 → game.html이 직접 읽어서 setSession
          redirect=redirect+'?gat='+encodeURIComponent(token)+'&grt='+encodeURIComponent(refresh||'');

        } else if(type==='modelhub'){
          if(!uid) return fail('사용자 정보 없음',redirect);
          localStorage.setItem('userId',uid);
          localStorage.setItem('isAdmin',adm);
          localStorage.setItem('isPro',pro);

        } else {
          return fail('알 수 없는 타입: '+type, redirect);
        }

        prog(90,'리디렉션 준비');
        document.getElementById('badgeTxt').textContent=name+' 로그인 완료';
        setTimeout(function(){
          done(name+' 로그인 완료 ✓','자동으로 이동합니다...',redirect);
        },350);

      } catch(e){
        fail('오류: '+e.message, redirect);
      }
    }, 400);
  }, 500);
})();
</script>
</body>
</html>
